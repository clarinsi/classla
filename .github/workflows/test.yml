name: Test loading in different python versions

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "."

      - name: Smoke test import
        run: python -c "import classla; print('classla', classla.__version__)"

      - name: Smoke test tokenization pipeline
        run: |
          python - <<'PY'
          import os
          import tempfile

          import classla

          resources_dir = os.path.join(tempfile.mkdtemp(), "classla_resources")
          classla.download(lang="sl", dir=resources_dir, processors="tokenize", logging_level="info")
          nlp = classla.Pipeline(lang="sl", dir=resources_dir, processors="tokenize", logging_level="info")
          doc = nlp("France Prešeren je bil rojen v Vrbi.")
          tokens = [word.text for sentence in doc.sentences for word in sentence.words]
          assert tokens == ["France", "Prešeren", "je", "bil", "rojen", "v", "Vrbi", "."], tokens
          print("Tokenization OK:", tokens)
          PY
